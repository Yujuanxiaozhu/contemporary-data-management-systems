{% extends 'base.html' %}{% block content %}<h1>{{ '注册' if mode == 'register' else '登录' }}</h1><form id="account-form" data-mode="{{ mode }}"><label>用户名<input name="username" required maxlength="64" autocomplete="username"></label><label>密码<input name="password" type="password" required minlength="8" maxlength="128" autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}"></label><button>{{ '注册并前往登录' if mode == 'register' else '登录' }}</button></form>{% endblock %}
